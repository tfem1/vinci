name: Bump version

# Actions → "Bump version" → enter 0.2.0 (stable) or 0.3.0-beta.1 (beta).
# Commits the new version and pushes the tag, which triggers the Release workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (semver, e.g. 0.2.0 or 0.3.0-beta.1)"
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.RELEASE_PAT || github.token }}" }
      - name: Bump
        run: scripts/bump-version.sh "${{ github.event.inputs.version }}"
      - name: Update Cargo.lock
        run: cargo update -w
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push origin HEAD --tags
# Note: tags pushed with the default GITHUB_TOKEN do not trigger other workflows.
# Add a fine-grained token with "contents: write" as secret RELEASE_PAT to chain the
# Release workflow automatically, or run Release manually with the tag.
